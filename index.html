<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Find et spil</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Find et spil</h1>
    </header>

    <main>
      <!-- Søgefelt = tekstfelt + knap der hedder "Søg" -->
      <form id="search-form" class="search-form" role="search">
        <input
          type="search"
          id="search-input"
          placeholder="Søg efter titel eller genre"
          aria-label="Søg efter spil"
        />
        <button type="submit" class="btn-search">Søg</button>
      </form>

      <div class="toolbar">
        <select id="sort-select" aria-label="Sorter spil">
          <option value="titel">Titel A–Å</option>
          <option value="tid-kort">Spilletid: kortest først</option>
          <option value="tid-lang">Spilletid: længst først</option>
        </select>
        <button id="filter-toggle" class="btn-filter">
          Filtrer <span id="filter-badge" class="badge" hidden>0</span>
        </button>
      </div>

      <p id="result-count" class="result-count" aria-live="polite"></p>
      <div id="games-container" class="games-grid"></div>
    </main>

    <!-- Filterpanel (kommer ind nedefra) -->
    <div id="overlay" class="overlay"></div>
    <section id="filter-panel" class="filter-panel" aria-label="Filtrer spil">
      <div class="panel-header">
        <h2>Filtrer</h2>
        <button id="close-filter" class="close-btn" aria-label="Luk filter">
          &times;
        </button>
      </div>

      <div class="panel-content">
        <fieldset>
          <legend>Genre</legend>
          <label
            ><input type="checkbox" name="genre" value="selskabsspil" />
            Selskabsspil</label
          >
          <label
            ><input type="checkbox" name="genre" value="kortspil" />
            Kortspil</label
          >
          <label
            ><input type="checkbox" name="genre" value="quiz" /> Quiz</label
          >
          <label
            ><input type="checkbox" name="genre" value="samarbejde" />
            Samarbejde</label
          >
          <label
            ><input type="checkbox" name="genre" value="strategispil" />
            Strategispil</label
          >
        </fieldset>

        <fieldset>
          <legend>Sværhedsgrad</legend>
          <label
            ><input type="radio" name="saerhedsgrad" value="" checked />
            Alle</label
          >
          <label
            ><input type="radio" name="saerhedsgrad" value="lav" /> Lav</label
          >
          <label
            ><input type="radio" name="saerhedsgrad" value="medium" />
            Medium</label
          >
          <label
            ><input type="radio" name="saerhedsgrad" value="svær" /> Svær</label
          >
        </fieldset>

        <fieldset>
          <legend>Sprog</legend>
          <label
            ><input type="radio" name="sprog" value="" checked /> Alle</label
          >
          <label><input type="radio" name="sprog" value="DA" /> Dansk</label>
          <label><input type="radio" name="sprog" value="EN" /> Engelsk</label>
        </fieldset>

        <fieldset>
          <legend>
            Antal spillere: <output id="players-output">Alle</output>
          </legend>
          <input
            type="range"
            id="players-range"
            min="0"
            max="20"
            value="0"
            aria-label="Antal spillere"
          />
        </fieldset>

        <fieldset>
          <legend>
            Spilletid: <output id="time-output">Ingen grænse</output>
          </legend>
          <input
            type="range"
            id="time-range"
            min="10"
            max="90"
            step="5"
            value="90"
            aria-label="Højeste spilletid"
          />
        </fieldset>
      </div>

      <div class="panel-footer">
        <button id="reset-filters" class="btn-secondary">Nulstil</button>
        <button id="apply-filters" class="btn-primary">Vis spil</button>
      </div>
    </section>

    <!-- Detaljevisning -->
    <dialog id="game-dialog">
      <div id="dialog-body"></div>
      <button id="dialog-close" class="btn-primary">Luk</button>
    </dialog>

    <script src="games.js"></script>
    <script src="scriptui.js"></script>
    <script src="scriptfilt.js"></script>
  </body>
</html>
